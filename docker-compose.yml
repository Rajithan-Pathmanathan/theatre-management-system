services:
  postgres:
    image: postgres:16-alpine
    container_name: theatre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theatre
      POSTGRES_USER: theatre
      POSTGRES_PASSWORD: theatre
    ports:
      # host 5433, not 5432 — this machine already has a native Postgres
      # service bound to 5432; using a different host port avoids the
      # conflict entirely instead of touching that pre-existing service.
      - "5433:5432"
    volumes:
      - theatre-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theatre -d theatre"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  theatre-postgres-data:
