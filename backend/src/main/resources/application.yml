server:
  port: ${SERVER_PORT:8081} # 8081, not 8080 — this machine already has an unrelated httpd bound to 8080

spring:
  application:
    name: theatre-management-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/theatre} # 5433, not 5432 — see docker-compose.yml
    username: ${DB_USERNAME:theatre}
    password: ${DB_PASSWORD:theatre}

  jpa:
    open-in-view: false # force each service method to load what it needs inside its own
      # transaction instead of lazy-loading from the view layer — avoids N+1 surprises
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-in-every-real-environment-32chars+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  seat-lock:
    duration-minutes: 10 # BR-03 / FR-19
  payhere:
    # Sandbox defaults only — every real environment must override these with a real
    # PayHere merchant account's own id/secret (https://www.payhere.lk), same as the
    # jwt secret and admin-seed password above.
    merchant-id: ${PAYHERE_MERCHANT_ID:sandbox-merchant-id}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:sandbox-merchant-secret}
    checkout-base-url: ${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
    return-url: ${PAYHERE_RETURN_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYHERE_CANCEL_URL:http://localhost:5173/payment/cancel}
    notify-url: ${PAYHERE_NOTIFY_URL:http://localhost:8081/api/payments/payhere/notify}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-seed:
    # Bootstraps the one and only admin account when staff_accounts is empty (AdminAccountSeeder).
    # These defaults are for local dev only — override both in every other environment and change
    # the password immediately after first login.
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:change-me-immediately}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.vijaya.theatre: DEBUG
